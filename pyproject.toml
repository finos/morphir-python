[project]
name = "morphir-python"
version = "0.0.1"
description = "Morphir domain modeling library, SDK runtime, and CLI for Python"
requires-python = ">=3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "FINOS", email = "morphir@finos.org" }]
keywords = ["morphir", "domain-modeling", "functional", "cli", "ir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.15",
    # Rich uses Pygments; older versions are affected by CVE-2026-4539.
    "pygments>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/finos/morphir-python"
Documentation = "https://morphir.finos.org"
Repository = "https://github.com/finos/morphir-python"
Issues = "https://github.com/finos/morphir-python/issues"

[project.scripts]
morphir-python = "morphir_tools.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/morphir/src/morphir", "packages/morphir-tools/src/morphir_tools"]

[tool.hatch.build.targets.sdist]
only-include = ["packages", "README.md", "LICENSE", "uv.lock"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pyright>=1.1",
    "pre-commit>=4.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "behave>=1.2",
    "coverage>=7.0",
]

[tool.uv]
managed = true

[tool.uv.workspace]
members = ["packages/morphir"]

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [".venv", "build", "dist", ".git", "__pycache__"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # Pyflakes
    "I",          # isort
    "N",          # pep8-naming
    "UP",         # pyupgrade
    "B",          # flake8-bugbear
    "C4",         # flake8-comprehensions
    "SIM",        # flake8-simplify
    "TCH",        # flake8-type-checking
    "RUF",        # Ruff-specific
    "D",          # pydocstyle
]
ignore = [
    "D100",       # Missing docstring in public module
    "D104",       # Missing docstring in public package
    "D105",       # Missing docstring in magic method
    "D107",       # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D101", "D102", "D103", "E501"]
"packages/morphir/src/morphir/ir/**/*.py" = ["D101", "D102", "D103", "UP006", "UP007", "UP035", "UP037", "UP046", "TC001", "TC003", "E501", "C408", "RUF005", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["morphir", "morphir_tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# =============================================================================
# Mypy Configuration
# =============================================================================
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
show_column_numbers = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/morphir/src", "packages/morphir-tools/src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "features.*"
ignore_errors = true

# =============================================================================
# Pyright Configuration
# =============================================================================
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
include = ["packages/morphir/src", "packages/morphir-tools/src", "tests"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["packages/morphir/src", "packages/morphir-tools/src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
    "raise NotImplementedError",
]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
