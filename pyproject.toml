[project]
name = "morphir-workspace"
version = "0.0.1"
description = "Development workspace for the Morphir library and CLI"
requires-python = ">=3.14"
readme = "README.md"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pyright>=1.1",
    "pre-commit>=4.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "behave>=1.2",
    "coverage>=7.0",
]

[tool.uv]
managed = true

[tool.uv.workspace]
members = ["packages/morphir", "packages/morphir-python-native", "packages/morphir-tools"]

[tool.uv.sources]
morphir = { workspace = true }
morphir-python-native = { workspace = true }

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
target-version = "py314"
line-length = 88
# rust/ holds compiler test inputs whose exact text is part of the tests.
exclude = [".venv", "build", "dist", ".git", "__pycache__", "rust"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # Pyflakes
    "I",          # isort
    "N",          # pep8-naming
    "UP",         # pyupgrade
    "B",          # flake8-bugbear
    "C4",         # flake8-comprehensions
    "SIM",        # flake8-simplify
    "TCH",        # flake8-type-checking
    "RUF",        # Ruff-specific
    "D",          # pydocstyle
]
ignore = [
    "D100",       # Missing docstring in public module
    "D104",       # Missing docstring in public package
    "D105",       # Missing docstring in magic method
    "D107",       # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D101", "D102", "D103", "E501"]
# The benchmark report embeds the HTML document template's long head lines.
"scripts/bench.py" = ["E501"]
# Compiler input: the supported subset has no TYPE_CHECKING blocks.
"tests/fixtures/python/**/*" = ["TC001", "TC003"]
"packages/morphir/src/morphir/ir/**/*.py" = ["D101", "D102", "D103", "UP006", "UP007", "UP035", "UP037", "UP046", "TC001", "TC003", "E501", "C408", "RUF005", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["morphir", "morphir_tools", "morphir_python_native"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# =============================================================================
# Mypy Configuration
# =============================================================================
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
show_column_numbers = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/morphir/src", "packages/morphir-tools/src", "packages/morphir-python-native/python"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "features.*"
ignore_errors = true

# =============================================================================
# Pyright Configuration
# =============================================================================
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
include = ["packages/morphir/src", "packages/morphir-tools/src", "packages/morphir-python-native/python", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["packages/morphir/src", "packages/morphir-tools/src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
    "raise NotImplementedError",
]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
