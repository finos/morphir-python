[project]
name = "morphir-tools"
version = "0.1.0"
description = "CLI tools and extensions for Morphir Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
keywords = ["morphir", "cli", "tools", "code-generation", "domain-modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [
    { name = "FINOS", email = "morphir@finos.org" }
]
dependencies = [
    "morphir>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/finos/morphir-python"
Documentation = "https://morphir.finos.org"
Repository = "https://github.com/finos/morphir-python"
Issues = "https://github.com/finos/morphir-python/issues"

[project.scripts]
# CLI entry points will be added here as features are implemented
# morphir = "morphir_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morphir_tools"]
