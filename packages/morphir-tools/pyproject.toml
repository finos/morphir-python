[project]
name = "morphir-python"
version = "0.0.1"
description = "CLI tools and extensions for Morphir Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["morphir", "cli", "tools", "code-generation", "domain-modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [
    { name = "FINOS", email = "morphir@finos.org" }
]
dependencies = [
    "morphir>=0.0.1",
    "typer>=0.15",
    # Rich uses Pygments; older versions are affected by CVE-2026-4539.
    "pygments>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/finos/morphir-python"
Documentation = "https://morphir.finos.org"
Repository = "https://github.com/finos/morphir-python"
Issues = "https://github.com/finos/morphir-python/issues"

[project.scripts]
morphir-python = "morphir_tools.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morphir_tools"]
