[project]
name = "morphir"
version = "0.1.0"
description = "Python port of Morphir - functional domain modeling for the enterprise"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
keywords = ["morphir", "domain-modeling", "functional", "dsl", "type-safe", "ir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
authors = [
    { name = "FINOS", email = "morphir@finos.org" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/finos/morphir-python"
Documentation = "https://morphir.finos.org"
Repository = "https://github.com/finos/morphir-python"
Issues = "https://github.com/finos/morphir-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morphir"]
