name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release-tag:
        description: Package-specific tag that must match its project version
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v3

      - name: Install dependencies
        run: mise run install

      - name: Run ruff linter
        run: mise run lint

      - name: Check formatting
        run: mise run format-check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v3

      - name: Install dependencies
        run: mise run install

      - name: Run type checkers
        run: mise run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v3

      - name: Install dependencies
        run: mise run install

      - name: Run pytest
        run: mise run coverage

      - name: Run behave
        run: mise run test-bdd

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v3

      - name: Build packages
        run: mise run build

      - name: Check distributions, vulnerabilities and licenses
        run: mise run release-check
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}

      - name: Upload morphir distributions
        uses: actions/upload-artifact@v6
        with:
          name: morphir-dist
          path: packages/morphir/dist/
          if-no-files-found: error

      - name: Upload morphir-python distributions
        uses: actions/upload-artifact@v6
        with:
          name: morphir-python-dist
          path: packages/morphir-tools/dist/
          if-no-files-found: error

      - name: Upload release scan reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-scan-reports
          path: .dev/release-check/*.json
          include-hidden-files: true
