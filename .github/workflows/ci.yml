name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Package-specific tag that must match its project version
        type: string
        default: ''
      qualify-mep:
        description: Run the source-pinned canonical MCK before release promotion
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Superseded pull request runs are cancelled; pushes and release calls are not.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      reason: ${{ steps.select.outputs.reason }}
      docs-examples: ${{ steps.select.outputs.docs-examples }}
      docs-hosts: ${{ steps.select.outputs.docs-hosts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select categories
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pushes and release qualification run everything.
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            python3 scripts/ci_changes.py select --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_changes.py select --full >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs).lint
    runs-on: ubuntu-latest
    env:
      MORPHIR_SKIP_NATIVE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise run install

      - name: Run ruff linter
        run: mise run lint

      - name: Check formatting
        run: mise run format-check

  typecheck:
    name: Type Check
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs).typecheck
    runs-on: ubuntu-latest
    env:
      MORPHIR_SKIP_NATIVE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise run install

      - name: Run type checkers
        run: mise run typecheck

  native-wheel:
    name: Native wheel (Linux x86_64)
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['native-wheel']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the manylinux_2_28 wheel and source archive
        uses: PyO3/maturin-action@v1
        env:
          # Maturin builds the wheel from an isolated sdist. Share registry
          # dependency objects with the process hook across that source path.
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        with:
          working-directory: packages/morphir-python-native
          maturin-version: '1.16.0'
          rust-toolchain: '1.98.1'
          manylinux: '2_28'
          target: x86_64-unknown-linux-gnu
          # Build the standalone guest in the same glibc 2.28 container. Its
          # shared compiler objects are then reused by the Python wheel build.
          before-script-linux: >-
            cargo build --manifest-path ../../rust/Cargo.toml --locked --release
            -p morphir-python-extension --target x86_64-unknown-linux-gnu
          args: --release --locked --sdist --out ../../dist/native

      - name: Audit the Linux baseline and bundled libraries
        shell: bash
        run: |
          # The build container writes dist/ as root.
          sudo chown -R "$(id -u):$(id -g)" dist
          pipx run --spec 'auditwheel==6.8.2' auditwheel show dist/native/*.whl | tee dist/native/auditwheel.txt
          # The report starts with the file name, so match auditwheel's own verdict.
          tr '\n' ' ' < dist/native/auditwheel.txt | tr -s ' ' \
            | grep -q 'consistent with the following platform tag: "manylinux_2_28_x86_64"'
          sha256sum dist/native/*.whl dist/native/*.tar.gz | tee dist/native/SHA256SUMS

      - name: Upload the native distributions
        uses: actions/upload-artifact@v7
        with:
          name: native-linux-x86_64
          path: dist/native/
          if-no-files-found: error

      - name: Upload the process executable from the portable build
        uses: actions/upload-artifact@v7
        with:
          name: process-linux-x86_64
          path: rust/target/x86_64-unknown-linux-gnu/release/morphir-python-extension
          if-no-files-found: error

  test:
    name: Test
    needs: [changes, native-wheel]
    if: fromJSON(needs.changes.outputs.jobs).test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Download the native distributions
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x86_64
          path: dist/native/

      - name: Install dependencies with the built native wheel
        run: |
          MORPHIR_NATIVE_WHEEL="$(ls dist/native/*.whl)" mise run install

      - name: Run pytest and check the native stubs
        run: mise run coverage

      - name: Run behave
        run: mise run test-bdd

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  rust:
    name: Rust
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs).rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format, lint, test and build the WASM guest
        run: mise run rust:check

      - name: Build an independent Cargo consumer
        run: mise run rust:consumer

  bundle:
    name: Extension guest build
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs).bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The retired Rust CLI negotiates only 0.1. Current guests expose 0.2.
      # Process package installation is exercised in release-extension.yml.
      - name: Build and validate the WASM guest
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked --release -p morphir-python-binding --target wasm32-unknown-unknown
          wasm-tools validate rust/target/wasm32-unknown-unknown/release/morphir_python_binding.wasm

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck, test, native-wheel]
    if: fromJSON(needs.changes.outputs.jobs).build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Build packages
        run: mise run build

      - name: Download the native distributions
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x86_64
          path: dist/native/

      - name: Check distributions, vulnerabilities and licenses
        run: mise run release-check
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}

      - name: Qualify the native archive and a clean install without Rust
        run: mise run native:qualify
        env:
          NATIVE_DIST: ${{ github.workspace }}/dist/native
          # A python-v release qualifies the published native wheel instead.
          RELEASE_TAG: ${{ inputs.release-tag }}

      - name: Qualify mise uv and pipx candidate installs
        if: ${{ !startsWith(inputs.release-tag, 'morphir-v') }}
        run: mise run cli:qualify-mise
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}

      - name: Upload morphir distributions
        uses: actions/upload-artifact@v7
        with:
          name: morphir-dist
          path: packages/morphir/dist/
          if-no-files-found: error

      - name: Upload morphir-python distributions
        uses: actions/upload-artifact@v7
        with:
          name: morphir-python-dist
          path: packages/morphir-tools/dist/
          if-no-files-found: error

      - name: Upload release scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-scan-reports
          path: |
            .dev/release-check/*.json
            .dev/qualification/*.json
          include-hidden-files: true

  docs:
    name: Documentation
    needs: [changes, native-wheel]
    if: >-
      always() && needs.changes.result == 'success' &&
      fromJSON(needs.changes.outputs.jobs).docs &&
      (needs.native-wheel.result == 'success' || needs.native-wheel.result == 'skipped')
    uses: ./.github/workflows/docs.yml
    with:
      examples: ${{ needs.changes.outputs.docs-examples == 'true' }}
      hosts: ${{ needs.changes.outputs.docs-hosts == 'true' }}
      native-wheel: ${{ fromJSON(needs.changes.outputs.jobs)['native-wheel'] }}

  all-checks:
    name: All Checks
    if: always()
    needs: [changes, lint, typecheck, native-wheel, test, rust, bundle, build, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require every selected check
        env:
          SELECTED: ${{ needs.changes.outputs.jobs || '{}' }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_changes.py aggregate --selected "$SELECTED" --needs "$NEEDS"
