name: Release

on:
  push:
    tags:
      - 'v*'
  # Qualification only. Publishing requires a tag push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify release
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  publish-morphir:
    name: Publish morphir to PyPI
    if: github.event_name == 'push' && github.repository == 'finos/morphir-python'
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/morphir/
    steps:
      - name: Download morphir dist
        uses: actions/download-artifact@v7
        with:
          name: morphir-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-morphir-tools:
    name: Publish morphir-tools to PyPI
    needs: [qualify, publish-morphir]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/morphir-tools/
    steps:
      - name: Download morphir-tools dist
        uses: actions/download-artifact@v7
        with:
          name: morphir-tools-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [publish-morphir, publish-morphir-tools]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*-dist'
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
