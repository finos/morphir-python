name: Release

on:
  push:
    tags:
      - 'morphir-v*'
      - 'python-v*'
  # Qualification only. Publishing requires a tag push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify release
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  publish-morphir:
    name: Publish morphir library and SDK to PyPI
    if: >-
      github.event_name == 'push' &&
      github.repository == 'finos/morphir-python' &&
      startsWith(github.ref, 'refs/tags/morphir-v')
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/morphir/
    steps:
      - name: Download qualified morphir distributions
        uses: actions/download-artifact@v7
        with:
          name: morphir-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-morphir-python:
    name: Publish morphir-python to PyPI
    if: >-
      github.event_name == 'push' &&
      github.repository == 'finos/morphir-python' &&
      startsWith(github.ref, 'refs/tags/python-v')
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/morphir-python/
    steps:
      - name: Download morphir-python dist
        uses: actions/download-artifact@v7
        with:
          name: morphir-python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [publish-morphir, publish-morphir-python]
    if: >-
      always() && !cancelled() &&
      (needs.publish-morphir.result == 'success' ||
       needs.publish-morphir-python.result == 'success') &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download the published package artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/morphir-v') && 'morphir-dist' || 'morphir-python-dist' }}
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
