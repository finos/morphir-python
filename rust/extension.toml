# The morphir-python MEP extension bundle built from this repository.
#
# [extension] uses the keys of a finos/morphir-rust `.github/extensions.toml`
# entry, so the canonical WASM packager reads it unchanged.

[extension]
short_id = "python"
package = "morphir-python-binding"
artifact = "morphir-python-binding"
extension_id = "morphir-python"
name = "Morphir Python"
mep_versions = ["0.1"]
targets = ["python"]
languages = [{ id = "python", file_extensions = [".py"] }]
ir_versions = ["3", "4"]
release_with_workspace = true

# The finos/morphir `extension bundle` command packages native process
# extensions only, so WASM bundles still come from morphir-rust's packager
# (scripts/package_extension.py). It runs unchanged at this exact revision.
[packager]
repository = "https://github.com/finos/morphir-rust.git"
rev = "0aa60eb799d46f8a317ec47abef4a7a4e61dc8ac"

# The released Morphir CLI that installs and runs the bundle offline.
[host]
version = "0.4.0-beta.10"
release = "https://github.com/finos/morphir/releases/download/v0.4.0-beta.10"

[host.sha256]
"x86_64-unknown-linux-gnu" = "3f6dc0559e7570d9cdb9c95761333552593da6bc8c788b9da3bb4a1d93101923"
"aarch64-unknown-linux-gnu" = "76a92a11030cd254d2283e98363cf203f86aaecd583fa480bdf6f508c86710f6"
"aarch64-apple-darwin" = "98635ec74fbdc3c2cef1d4ae184bb1c5ed9e2960575f3d8abb4b97e0e4da363f"
"x86_64-apple-darwin" = "4080dcfb04f6e1c902bce2780756c6af44320ac0dd6ff6bd953ca74a0da8e128"
