[package]
name = "morphir-python-native"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Private CPython bridge to the Morphir Python compiler"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
morphir-python-binding = { path = "../morphir-python-binding" }
morphir-extension-sdk.workspace = true
pyo3 = { version = "=0.30.1", features = ["abi3-py314"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true

[features]
# The CPython module. Maturin enables it; Rust tests and benchmarks of the
# bridge logic build without an interpreter.
python = ["dep:pyo3"]
